services:
  api1:
    image: gabrielgomeslira/rinha-2026-fraud-java:latest
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "163MB"

  api2:
    image: gabrielgomeslira/rinha-2026-fraud-java:latest
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "163MB"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api1, api2]
    ports:
      - "9999:9999"
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "24MB"

networks:
  app:
    driver: bridge
